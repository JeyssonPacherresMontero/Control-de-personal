<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Preview Manos Biométricas Color Piel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: sans-serif; background: #f1f5f9; padding: 20px; }
        .hand-svg-diagram { width: 100%; max-width: 280px; height: auto; display: block; margin: 0 auto; filter: drop-shadow(0 8px 16px rgba(180, 109, 67, 0.15)); }
        .finger-touch-node { cursor: pointer; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        .finger-touch-node circle.node-circle { fill: rgba(255,255,255,0.92); stroke: #c8825c; stroke-width: 2.2; transition: all 0.25s ease; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.12)); }
        .finger-touch-node text.node-label { font-size: 11px; font-weight: 800; fill: #5c2c16; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
        .finger-touch-node:hover circle.node-circle { fill: #dbeafe; stroke: #2563eb; stroke-width: 3.5; r: 16; }
        .finger-touch-node:hover text.node-label { fill: #1d4ed8; }
        .finger-touch-node.is-active circle.node-circle { fill: #16a34a !important; stroke: #14532d !important; stroke-width: 3.5 !important; r: 17 !important; filter: drop-shadow(0 0 8px rgba(22, 163, 74, 0.85)); }
        .finger-touch-node.is-active text.node-label { fill: #ffffff !important; font-weight: 900 !important; }
    </style>
</head>
<body>
    <div style="display:flex; gap:20px; justify-content:center;">
        <!-- Left Hand -->
        <div style="background:#fff; padding:15px; border-radius:12px; border:1px solid #e2e8f0; width:300px;">
            <h4 style="text-align:center; color:#0284c7; margin-top:0;">Mano Izquierda</h4>
            <svg class="hand-svg-diagram" viewBox="0 0 340 330" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="skinGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffe9dc" />
                        <stop offset="40%" stop-color="#fcd5bc" />
                        <stop offset="80%" stop-color="#f4be99" />
                        <stop offset="100%" stop-color="#e5a47a" />
                    </linearGradient>
                    <filter id="handShadow" x="-10%" y="-10%" width="120%" height="120%">
                        <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#a86036" flood-opacity="0.22" />
                    </filter>
                </defs>
                <path d="M 100,305 C 80,302 65,285 58,260 C 46,225 34,185 22,145 C 15,122 12,98 15,80 C 18,65 34,60 42,75 C 48,88 56,120 62,148 C 64,156 71,156 73,146 C 78,120 83,82 88,52 C 90,38 107,35 112,48 C 117,68 122,108 124,138 C 125,146 132,146 134,136 C 138,110 144,68 148,32 C 151,16 169,15 174,30 C 179,68 184,112 186,146 C 187,154 194,154 197,144 C 203,116 212,74 220,46 C 225,32 242,35 245,50 C 248,80 247,128 245,165 C 244,188 252,210 266,204 C 282,198 306,170 320,148 C 328,136 338,148 333,162 C 320,190 288,235 264,265 C 242,290 205,306 165,308 C 142,310 120,312 100,305 Z" 
                      fill="url(#skinGradLeft)" stroke="#8e5332" stroke-width="2.6" stroke-linejoin="round" filter="url(#handShadow)" />
                
                <!-- Pliegues y líneas de la mano -->
                <path d="M 68,235 C 110,250 175,230 220,205" fill="none" stroke="#d4946e" stroke-width="2" stroke-linecap="round" />
                <path d="M 85,190 C 130,215 190,195 240,175" fill="none" stroke="#d4946e" stroke-width="2" stroke-linecap="round" />
                <path d="M 195,280 C 225,250 250,225 265,200" fill="none" stroke="#d4946e" stroke-width="2" stroke-linecap="round" />

                <!-- Nodos táctiles en las yemas -->
                <g class="finger-touch-node" data-finger-id="9">
                    <circle class="node-circle" cx="28" cy="80" r="14" />
                    <text class="node-label" x="28" y="80">9</text>
                </g>
                <g class="finger-touch-node" data-finger-id="8">
                    <circle class="node-circle" cx="100" cy="50" r="14" />
                    <text class="node-label" x="100" y="50">8</text>
                </g>
                <g class="finger-touch-node" data-finger-id="7">
                    <circle class="node-circle" cx="161" cy="30" r="14" />
                    <text class="node-label" x="161" y="30">7</text>
                </g>
                <g class="finger-touch-node" data-finger-id="6">
                    <circle class="node-circle" cx="233" cy="48" r="14" />
                    <text class="node-label" x="233" y="48">6</text>
                </g>
                <g class="finger-touch-node" data-finger-id="5">
                    <circle class="node-circle" cx="320" cy="155" r="14" />
                    <text class="node-label" x="320" y="155">5</text>
                </g>
            </svg>
        </div>

        <!-- Right Hand -->
        <div style="background:#fff; padding:15px; border-radius:12px; border:1px solid #e2e8f0; width:300px;">
            <h4 style="text-align:center; color:#2563eb; margin-top:0;">Mano Derecha</h4>
            <svg class="hand-svg-diagram" viewBox="0 0 340 330" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="skinGradRight" x1="100%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#ffe9dc" />
                        <stop offset="40%" stop-color="#fcd5bc" />
                        <stop offset="80%" stop-color="#f4be99" />
                        <stop offset="100%" stop-color="#e5a47a" />
                    </linearGradient>
                </defs>
                <path d="M 240,305 C 260,302 275,285 282,260 C 294,225 306,185 318,145 C 325,122 328,98 325,80 C 322,65 306,60 298,75 C 292,88 284,120 278,148 C 276,156 269,156 267,146 C 262,120 257,82 252,52 C 250,38 233,35 228,48 C 223,68 218,108 216,138 C 215,146 208,146 206,136 C 202,110 196,68 192,32 C 189,16 171,15 166,30 C 161,68 156,112 154,146 C 153,154 146,154 143,144 C 137,116 128,74 120,46 C 115,32 98,35 95,50 C 92,80 93,128 95,165 C 96,188 88,210 74,204 C 58,198 34,170 20,148 C 12,136 2,148 7,162 C 20,190 52,235 76,265 C 98,290 135,306 175,308 C 198,310 220,312 240,305 Z" 
                      fill="url(#skinGradRight)" stroke="#8e5332" stroke-width="2.6" stroke-linejoin="round" filter="url(#handShadow)" />
                
                <!-- Pliegues y líneas de la mano -->
                <path d="M 272,235 C 230,250 165,230 120,205" fill="none" stroke="#d4946e" stroke-width="2" stroke-linecap="round" />
                <path d="M 255,190 C 210,215 150,195 100,175" fill="none" stroke="#d4946e" stroke-width="2" stroke-linecap="round" />
                <path d="M 145,280 C 115,250 90,225 75,200" fill="none" stroke="#d4946e" stroke-width="2" stroke-linecap="round" />

                <!-- Nodos táctiles en las yemas -->
                <g class="finger-touch-node" data-finger-id="0">
                    <circle class="node-circle" cx="20" cy="155" r="14" />
                    <text class="node-label" x="20" y="155">0</text>
                </g>
                <g class="finger-touch-node is-active" data-finger-id="1">
                    <circle class="node-circle" cx="107" cy="48" r="14" />
                    <text class="node-label" x="107" y="48">1</text>
                </g>
                <g class="finger-touch-node" data-finger-id="2">
                    <circle class="node-circle" cx="179" cy="30" r="14" />
                    <text class="node-label" x="179" y="30">2</text>
                </g>
                <g class="finger-touch-node" data-finger-id="3">
                    <circle class="node-circle" cx="240" cy="50" r="14" />
                    <text class="node-label" x="240" y="50">3</text>
                </g>
                <g class="finger-touch-node" data-finger-id="4">
                    <circle class="node-circle" cx="312" cy="80" r="14" />
                    <text class="node-label" x="312" y="80">4</text>
                </g>
            </svg>
        </div>
    </div>
</body>
</html>
